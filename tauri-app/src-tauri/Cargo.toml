[package]
name = "process-killer"
version = "2.0.0"
description = "Process Killer - find, stop, uninstall and clean up software on Windows"
authors = ["mba-x86"]
license = "MIT"
edition = "2021"
rust-version = "1.77"
build = "build.rs"

[lib]
name = "pk_lib"
path = "src/lib.rs"

[[bin]]
name = "ProcessKiller"
path = "src/main.rs"

[features]
# Embeds ui/ into the exe (what `tauri build` does). Needed for a plain `cargo build --release`.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression", "common-controls-v6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# system access (no PowerShell where a direct API exists = faster + no console windows)
winreg = "0.55"
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk", "network"] }
sha2 = "0.10"
# HTTPS for the updater (rustls = no OpenSSL DLL to ship)
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
minisign-verify = "0.2"
walkdir = "2"

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_System_Registry", "Win32_System_Services", "Win32_System_Threading", "Win32_System_ProcessStatus",
  "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_SystemServices",
  "Win32_System_Performance", "Win32_System_Power", "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Com", "Win32_System_Wmi", "Win32_System_Variant", "Win32_System_Ole",
  "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
  "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock",
  "Win32_Graphics_Dxgi", "Win32_System_Console",
  # added for perf (memory/network/gpu)
  "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_System_LibraryLoader",
]

[profile.release]
opt-level = "s"       # small first: this is a system tool, not a number cruncher
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
